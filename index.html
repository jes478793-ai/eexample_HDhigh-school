<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 대탈출</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            touch-action: none;
            user-select: none;
        }
        /* Custom canvas styling */
        #gameCanvas {
            background: radial-gradient(circle at center, #1b1b3a 0%, #0a0a16 100%);
            display: block;
            width: 100%;
            max-width: 480px;
            height: 640px;
            margin: 0 auto;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-4 flex flex-col items-center border border-slate-700">
        
        <!-- Header -->
        <div class="text-center mb-3">
            <h1 class="text-3xl text-yellow-300 drop-shadow-md">🐱 우주 대탈출 🚀</h1>
            <p class="text-xs text-slate-400 mt-1">목표: 운석을 피해 오래 살아남기!</p>
        </div>

        <!-- Game Screen Container -->
        <div class="relative w-full flex justify-center">
            <!-- Mute/Unmute Button in Top-Right Corner -->
            <button id="soundToggleBtn" class="absolute top-3 right-3 z-20 bg-slate-900/80 hover:bg-slate-700 text-yellow-300 border border-slate-600 rounded-full p-2 text-xl transition transform active:scale-95 focus:outline-none" title="소리 켜기/끄기">
                🔊
            </button>

            <canvas id="gameCanvas" width="480" height="640"></canvas>

            <!-- Touch Controls Overlay for Mobile (Hidden on MD screens and above) -->
            <div id="touchControls" class="absolute bottom-4 left-0 right-0 flex justify-between px-6 z-20 pointer-events-none md:hidden">
                <!-- D-Pad Directional Cluster -->
                <div class="grid grid-cols-3 gap-1 pointer-events-auto">
                    <div></div>
                    <button id="upBtn" class="w-[70px] h-[70px] bg-slate-900/60 active:bg-yellow-500/80 border-2 border-slate-400/50 rounded-2xl flex items-center justify-center text-2xl text-yellow-300 backdrop-blur-sm shadow-lg select-none active:scale-95 transition-transform touch-none">▲</button>
                    <div></div>
                    <button id="leftBtn" class="w-[70px] h-[70px] bg-slate-900/60 active:bg-yellow-500/80 border-2 border-slate-400/50 rounded-2xl flex items-center justify-center text-2xl text-yellow-300 backdrop-blur-sm shadow-lg select-none active:scale-95 transition-transform touch-none">◀</button>
                    <div></div>
                    <button id="rightBtn" class="w-[70px] h-[70px] bg-slate-900/60 active:bg-yellow-500/80 border-2 border-slate-400/50 rounded-2xl flex items-center justify-center text-2xl text-yellow-300 backdrop-blur-sm shadow-lg select-none active:scale-95 transition-transform touch-none">▶</button>
                    <div></div>
                    <button id="downBtn" class="w-[70px] h-[70px] bg-slate-900/60 active:bg-yellow-500/80 border-2 border-slate-400/50 rounded-2xl flex items-center justify-center text-2xl text-yellow-300 backdrop-blur-sm shadow-lg select-none active:scale-95 transition-transform touch-none">▼</button>
                    <div></div>
                </div>
            </div>

            <!-- Start Screen Overlay -->
            <div id="startScreen" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="text-6xl mb-3">🚀</div>
                <h2 class="text-3xl text-yellow-400 font-bold mb-2">우주 대탈출</h2>
                <p class="text-sm text-slate-300 mb-4 leading-relaxed">
                    운석을피해 살아남으세요
                </p>

                <!-- Controls Guide Section -->
                <div class="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 mb-6 w-full max-w-xs text-xs text-slate-300 space-y-1.5 shadow-inner">
                    <div class="text-yellow-300 font-bold mb-1 text-sm">🎮 조작 방법</div>
                    <div class="flex justify-between items-center px-2">
                        <span class="text-slate-400">PC 키보드:</span>
                        <span class="font-mono bg-slate-800 border border-slate-600 px-1.5 py-0.5 rounded text-yellow-200">방향키 / WASD</span>
                    </div>
                    <div class="flex justify-between items-center px-2">
                        <span class="text-slate-400">일시정지:</span>
                        <span class="font-mono bg-slate-800 border border-slate-600 px-1.5 py-0.5 rounded text-yellow-200">P 키</span>
                    </div>
                    <div class="flex justify-between items-center px-2">
                        <span class="text-slate-400">모바일:</span>
                        <span class="text-yellow-200">하단 터치 버튼</span>
                    </div>
                </div>

                <button id="startButton" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-bold px-8 py-3 rounded-full text-xl shadow-lg transform transition hover:scale-105 active:scale-95 cursor-pointer">
                    시작
                </button>
            </div>

            <!-- Pause Screen Overlay -->
            <div id="pauseScreen" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center z-30 hidden">
                <div class="text-6xl mb-3">⏸️</div>
                <h2 class="text-3xl text-yellow-400 font-bold mb-2">일시정지</h2>
                <p class="text-sm text-slate-300 mb-4 leading-relaxed">
                    게임이 잠시 멈췄습니다.<br>
                    다시 진행하려면 <span class="text-yellow-300 font-bold">'P' 키</span>를 누르세요.
                </p>
            </div>

            <!-- Game Over / Victory Overlay -->
            <div id="endScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center hidden z-10">
                <div id="endIcon" class="text-6xl mb-2">🏆</div>
                <h2 id="endTitle" class="text-3xl font-bold mb-2 text-yellow-400">승리!</h2>
                <p id="endDesc" class="text-sm text-slate-300 mb-4">우주를 안전하게 탈출했습니다!</p>
                <p class="text-xs text-yellow-300/80 mb-6 animate-pulse">[R] 키를 누르시면 시작 화면으로 이동합니다.</p>
                <button id="restartButton" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-bold px-8 py-3 rounded-full text-lg shadow-lg transform transition hover:scale-105 active:scale-95 cursor-pointer">
                    시작 화면으로
                </button>
            </div>
        </div>

        <!-- Controls helper for mobile -->
        <div class="hidden">
            <button id="oldUpBtn"></button>
            <button id="oldDownBtn"></button>
            <button id="oldLeftBtn"></button>
            <button id="oldRightBtn"></button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const startScreen = document.getElementById('startScreen');
            const pauseScreen = document.getElementById('pauseScreen');
            const endScreen = document.getElementById('endScreen');
            const startButton = document.getElementById('startButton');
            const restartButton = document.getElementById('restartButton');
            const endTitle = document.getElementById('endTitle');
            const endDesc = document.getElementById('endDesc');
            const endIcon = document.getElementById('endIcon');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');
            const soundToggleBtn = document.getElementById('soundToggleBtn');

            // Audio setup
            let isMuted = false;
            let audioEnabled = false;

            const bgmAudio = new Audio();
            bgmAudio.src = 'sounds/bgm.mp3'; // ogg 또는 mp3 호환 처리
            bgmAudio.loop = true;
            bgmAudio.onerror = () => { bgmAudio.src = 'sounds/bgm.ogg'; };

            function playSound(src) {
                if (isMuted || !audioEnabled) return;
                try {
                    const sound = new Audio(src);
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                } catch (e) {}
            }

            function playBGM() {
                if (isMuted || !audioEnabled) return;
                try {
                    bgmAudio.currentTime = 0;
                    bgmAudio.play().catch(() => {});
                } catch (e) {}
            }

            function pauseBGM() {
                try {
                    bgmAudio.pause();
                } catch (e) {}
            }

            function stopBGM() {
                try {
                    bgmAudio.pause();
                    bgmAudio.currentTime = 0;
                } catch (e) {}
            }

            if (soundToggleBtn) {
                soundToggleBtn.addEventListener('click', () => {
                    isMuted = !isMuted;
                    soundToggleBtn.innerText = isMuted ? '🔇' : '🔊';
                    if (isMuted) {
                        pauseBGM();
                    } else if (gameState === 'PLAYING') {
                        playBGM();
                    }
                });
            }

            // Images Setup
            const playerImg = new Image();
            playerImg.src = 'images/player.png';
            let playerLoaded = false;
            playerImg.onload = () => { playerLoaded = true; };

            const enemyImg = new Image();
            enemyImg.src = 'images/enemy.png';
            let enemyLoaded = false;
            enemyImg.onload = () => { enemyLoaded = true; };

            const bgImg = new Image();
            bgImg.src = 'images/background.png';
            let bgLoaded = false;
            bgImg.onload = () => { bgLoaded = true; };

            // Game State Variables
            let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER, VICTORY
            let score = 0;
            const targetScore = 1000;
            let lives = 3;
            let lastTime = 0;
            let meteorSpawnTimer = 0;
            let elapsedTime = 0; // Total play time in seconds for speed scaling
            // Stars background array (fallback if background image is not loaded)
            const stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 2 + 0.5
                });
            }

            // Cat Player Object
            const cat = {
                x: canvas.width / 2 - 30,
                y: canvas.height - 90,
                width: 60,
                height: 60,
                speed: 7
            };

            // Meteors Array
            let meteors = [];

            // Input handlers
            const keys = {
                ArrowLeft: false,
                ArrowRight: false,
                ArrowUp: false,
                ArrowDown: false
            };

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.ArrowLeft = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.ArrowRight = true;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.ArrowUp = true;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.ArrowDown = true;

                // Toggle Pause (P Key)
                if (e.key === 'p' || e.key === 'P') {
                    if (gameState === 'PLAYING') {
                        gameState = 'PAUSED';
                        if (pauseScreen) pauseScreen.classList.remove('hidden');
                        pauseBGM();
                    } else if (gameState === 'PAUSED') {
                        gameState = 'PLAYING';
                        if (pauseScreen) pauseScreen.classList.add('hidden');
                        lastTime = performance.now();
                        playBGM();
                    }
                }

                // Return to Start Screen (R Key from GameOver or Victory)
                if (e.key === 'r' || e.key === 'R') {
                    if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
                        goToStartScreen();
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.ArrowLeft = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.ArrowRight = false;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.ArrowUp = false;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.ArrowDown = false;
            });

            // Touch / Mouse button handlers for mobile/desktop UI
            const setTouchLeft = (isDown) => { keys.ArrowLeft = isDown; };
            const setTouchRight = (isDown) => { keys.ArrowRight = isDown; };
            const setTouchUp = (isDown) => { keys.ArrowUp = isDown; };
            const setTouchDown = (isDown) => { keys.ArrowDown = isDown; };

            if (leftBtn) {
                leftBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setTouchLeft(true); });
                leftBtn.addEventListener('mouseup', (e) => { e.preventDefault(); setTouchLeft(false); });
                leftBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); setTouchLeft(false); });
                leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setTouchLeft(true); });
                leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); setTouchLeft(false); });
            }

            if (rightBtn) {
                rightBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setTouchRight(true); });
                rightBtn.addEventListener('mouseup', (e) => { e.preventDefault(); setTouchRight(false); });
                rightBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); setTouchRight(false); });
                rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setTouchRight(true); });
                rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); setTouchRight(false); });
            }

            if (upBtn) {
                upBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setTouchUp(true); });
                upBtn.addEventListener('mouseup', (e) => { e.preventDefault(); setTouchUp(false); });
                upBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); setTouchUp(false); });
                upBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setTouchUp(true); });
                upBtn.addEventListener('touchend', (e) => { e.preventDefault(); setTouchUp(false); });
            }

            if (downBtn) {
                downBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setTouchDown(true); });
                downBtn.addEventListener('mouseup', (e) => { e.preventDefault(); setTouchDown(false); });
                downBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); setTouchDown(false); });
                downBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setTouchDown(true); });
                downBtn.addEventListener('touchend', (e) => { e.preventDefault(); setTouchDown(false); });
            }

            // Start game / Restart handlers
            if (startButton) startButton.addEventListener('click', startGame);
            if (restartButton) restartButton.addEventListener('click', goToStartScreen);

            function goToStartScreen() {
                gameState = 'START';
                stopBGM();
                if (pauseScreen) pauseScreen.classList.add('hidden');
                if (endScreen) endScreen.classList.add('hidden');
                if (startScreen) startScreen.classList.remove('hidden');
            }

            function startGame() {
                audioEnabled = true;
                gameState = 'PLAYING';
                score = 0;
                lives = 3;
                meteors = [];
                cat.x = canvas.width / 2 - cat.width / 2;
                cat.y = canvas.height - 90;
                meteorSpawnTimer = 0;
                elapsedTime = 0;
                lastTime = performance.now();
                if (startScreen) startScreen.classList.add('hidden');
                if (pauseScreen) pauseScreen.classList.add('hidden');
                if (endScreen) endScreen.classList.add('hidden');

                playBGM();
            }

            function gameOver(isWin) {
                gameState = isWin ? 'VICTORY' : 'GAMEOVER';
                stopBGM();

                if (!isWin) {
                    playSound('sounds/gameover.ogg');
                }

                if (endScreen) endScreen.classList.remove('hidden');
                if (isWin) {
                    if (endIcon) endIcon.innerText = '🎉';
                    if (endTitle) {
                        endTitle.innerText = '임무 성공!';
                        endTitle.className = 'text-3xl font-bold mb-2 text-green-400';
                    }
                    if (endDesc) endDesc.innerText = `${targetScore}점을 달성하여 우주를 탈출했습니다!`;
                } else {
                    if (endIcon) endIcon.innerText = '💥';
                    if (endTitle) {
                        endTitle.innerText = '게임 오버';
                        endTitle.className = 'text-3xl font-bold mb-2 text-red-400';
                    }
                    if (endDesc) endDesc.innerText = `운석 충돌로 탈출 실패! (최종 점수: ${Math.floor(score)}점 / Lv.${Math.floor(score / 50) + 1})`;
                }
            }

            // Spawn meteor function
            function spawnMeteor() {
                const width = 50;
                const height = 50;
                // Calculate 10% speed increase every 30 seconds: (1.10)^(elapsedTime / 30)
                const speedMultiplier = Math.pow(1.10, Math.floor(elapsedTime / 30));
                const baseSpeed = Math.random() * 3 + 3 + (score / 50);
                
                meteors.push({
                    x: Math.random() * (canvas.width - width),
                    y: -height,
                    width: width,
                    height: height,
                    speed: baseSpeed * speedMultiplier,
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.05
                });
            }

            // Update game logic
            function update(timestamp) {
                if (gameState !== 'PLAYING') return;

                const deltaTime = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                elapsedTime += deltaTime;

                // Increase score over time (approx 10 points per second)
                score += deltaTime * 10;
                if (score >= targetScore) {
                    score = targetScore;
                    gameOver(true);
                    return;
                }

                // Player Movement
                if (keys.ArrowLeft) cat.x -= cat.speed;
                if (keys.ArrowRight) cat.x += cat.speed;
                if (keys.ArrowUp) cat.y -= cat.speed;
                if (keys.ArrowDown) cat.y += cat.speed;

                // Screen boundaries for Player
                if (cat.x < 0) cat.x = 0;
                if (cat.x + cat.width > canvas.width) cat.x = canvas.width - cat.width;
                if (cat.y < 0) cat.y = 0;
                if (cat.y + cat.height > canvas.height) cat.y = canvas.height - cat.height;

                // Spawn meteors
                meteorSpawnTimer += deltaTime;
                if (meteorSpawnTimer > 0.6) {
                    spawnMeteor();
                    meteorSpawnTimer = 0;
                }

                // Update meteors & check collision (80% hitbox)
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.y += m.speed;
                    m.rotation += m.rotSpeed;

                    // 80% Hitbox Collision Detection
                    const playerHitbox = {
                        x: cat.x + cat.width * 0.1,
                        y: cat.y + cat.height * 0.1,
                        width: cat.width * 0.8,
                        height: cat.height * 0.8
                    };

                    const meteorHitbox = {
                        x: m.x + m.width * 0.1,
                        y: m.y + m.height * 0.1,
                        width: m.width * 0.8,
                        height: m.height * 0.8
                    };

                    if (
                        playerHitbox.x < meteorHitbox.x + meteorHitbox.width &&
                        playerHitbox.x + playerHitbox.width > meteorHitbox.x &&
                        playerHitbox.y < meteorHitbox.y + meteorHitbox.height &&
                        playerHitbox.y + playerHitbox.height > meteorHitbox.y
                    ) {
                        // Collision!
                        meteors.splice(i, 1);
                        lives--;
                        playSound('sounds/hit.ogg');

                        if (lives <= 0) {
                            gameOver(false);
                            return;
                        }
                        continue;
                    }

                    // Remove meteors below canvas
                    if (m.y > canvas.height + 50) {
                        meteors.splice(i, 1);
                    }
                }
            }

            // Render game elements
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw background (Image or fallback starfield)
                if (bgLoaded) {
                    const pattern = ctx.createPattern(bgImg, 'repeat');
                    ctx.fillStyle = pattern;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#ffffff';
                    stars.forEach(star => {
                        if (gameState === 'PLAYING') {
                            star.y += star.speed;
                            if (star.y > canvas.height) star.y = 0;
                        }
                        ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                        ctx.fillRect(star.x, star.y, star.size, star.size);
                    });
                    ctx.globalAlpha = 1.0;
                }

                // Draw Player (Image or Fallback vector cat)
                if (playerLoaded) {
                    ctx.drawImage(playerImg, cat.x, cat.y, cat.width, cat.height);
                } else {
                    const cx = cat.x + cat.width / 2;
                    const cy = cat.y + cat.height / 2;

                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.roundRect(cat.x + 15, cat.y + 20, 30, 35, 10);
                    ctx.fill();

                    ctx.fillStyle = '#ea580c';
                    ctx.beginPath();
                    ctx.moveTo(cat.x + 17, cat.y + 22);
                    ctx.lineTo(cat.x + 10, cat.y + 8);
                    ctx.lineTo(cat.x + 27, cat.y + 18);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(cat.x + 43, cat.y + 22);
                    ctx.lineTo(cat.x + 50, cat.y + 8);
                    ctx.lineTo(cat.x + 33, cat.y + 18);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.fillStyle = 'rgba(135, 206, 250, 0.2)';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 2, 24, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(cx - 6, cy - 10, 8, Math.PI * 1.2, Math.PI * 1.8);
                    ctx.stroke();

                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(cx - 7, cy - 6, 4, 4);
                    ctx.fillRect(cx + 3, cy - 6, 4, 4);
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(cx - 1, cy, 2, 2);
                }

                // Draw Meteors (Image or Fallback vector meteor)
                meteors.forEach(m => {
                    ctx.save();
                    ctx.translate(m.x + m.width / 2, m.y + m.height / 2);
                    ctx.rotate(m.rotation);

                    if (enemyLoaded) {
                        ctx.drawImage(enemyImg, -m.width / 2, -m.height / 2, m.width, m.height);
                    } else {
                        const radius = m.width / 2;
                        ctx.fillStyle = '#64748b';
                        ctx.strokeStyle = '#334155';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        const points = 7;
                        for (let i = 0; i < points; i++) {
                            const angle = (i / points) * Math.PI * 2;
                            const r = radius * (0.8 + Math.sin(i * 3) * 0.2);
                            const px = Math.cos(angle) * r;
                            const py = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = '#475569';
                        ctx.beginPath();
                        ctx.arc(-radius * 0.3, -radius * 0.2, radius * 0.25, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                });

                // Draw HUD (Score, Level & Lives)
                ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                ctx.fillRect(10, 10, canvas.width - 20, 45);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(10, 10, canvas.width - 20, 45);

                const currentLevel = Math.floor(score / 50) + 1;

                // Score & Level text
                ctx.fillStyle = '#facc15';
                ctx.font = '18px Jua';
                ctx.textAlign = 'left';
                ctx.fillText(`⭐ Lv.${currentLevel} | 점수: ${Math.floor(score)} / ${targetScore}`, 20, 38);

                // Lives hearts
                ctx.textAlign = 'right';
                let hearts = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
                ctx.fillText(`생명: ${hearts}`, canvas.width - 20, 38);
            }

            // Main Game Loop
            function gameLoop(timestamp) {
                update(timestamp);
                draw();
                requestAnimationFrame(gameLoop);
            }

            // Initial render call
            draw();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
